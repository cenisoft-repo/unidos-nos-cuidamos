name: Verificación sandbox

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias fijadas
        run: npm ci

      - name: Instalar Chromium de pruebas
        run: npx playwright install --with-deps chromium

      - name: Levantar Supabase local
        run: npm run db:start

      - name: Crear configuración exclusivamente local
        shell: bash
        run: |
          status="$(npx supabase status -o env)"
          api_url="$(printf '%s\n' "$status" | sed -n 's/^API_URL="\(.*\)"$/\1/p')"
          publishable_key="$(printf '%s\n' "$status" | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')"
          test -n "$api_url"
          test -n "$publishable_key"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$api_url"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$publishable_key"
            printf 'NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000\n'
          } > .env.local

      - name: Ejecutar verificación integral
        run: npm run verify

      - name: Conservar reporte Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Detener Supabase
        if: always()
        run: npm run db:stop
